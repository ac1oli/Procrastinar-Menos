# Serviços de infraestrutura local do Procrastinar Menos.
#
# Uso (a partir da raiz do repositório):
#   docker compose -f infrastructure/docker/compose.yml --env-file infrastructure/docker/.env up -d
#
# Segurança: todas as portas são publicadas apenas em 127.0.0.1.
# Nada aqui deve ficar acessível pela rede local ou pela internet sem
# uma decisão explícita documentada em docs/decisions/.

name: procrastinar-menos

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18
    container_name: pm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      # 5433 no host: a 5432 já é usada por um PostgreSQL 16 nativo de outro projeto.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pm_pgdata:/var/lib/postgresql
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: procrastinar-menos/backend-dev:local
    container_name: pm-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../backend:/app
    environment:
      # Credenciais vêm do .env desta pasta (fonte única); o Laravel não
      # sobrescreve variáveis já definidas no ambiente do processo.
      # A aplicação usa o papel de execução, sujeito à RLS (ADR-0008, D8). O dono
      # das tabelas só entra via infrastructure/scripts/artisan-owner.ps1.
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_RUNTIME_USER:?defina POSTGRES_RUNTIME_USER no .env}
      DB_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?defina POSTGRES_RUNTIME_PASSWORD no .env}
      NEXO_AI_SERVICE_URL: http://ai-service:8100
      NEXO_AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Tarefas agendadas do Laravel (retenção de auditoria, limpeza de tokens).
  scheduler:
    image: procrastinar-menos/backend-dev:local
    container_name: pm-scheduler
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../backend:/app
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_RUNTIME_USER}
      DB_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD}
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  # O backend continua funcionando sem este serviço (ADR-0003); por isso
  # não há depends_on dele no backend.
  ai-service:
    build:
      context: ../../ai-service
      dockerfile: ../infrastructure/docker/ai-service/Dockerfile
    image: procrastinar-menos/ai-service-dev:local
    container_name: pm-ai-service
    restart: unless-stopped
    volumes:
      - ../../ai-service:/app
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?defina AI_SERVICE_TOKEN no .env}
      # Docker Desktop encaminha host.docker.internal ao loopback do Windows,
      # onde o Ollama escuta (127.0.0.1:11434) sem ficar exposto à rede.
      AI_OLLAMA_URL: http://host.docker.internal:11434
      AI_CHAT_MODEL: qwen3:8b
      AI_EMBED_MODEL: qwen3-embedding:0.6b
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8100}:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pm_pgdata:
